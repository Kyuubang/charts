{{- range .Values.cronjobs }}
{{- $ctx := dict "job" . "root" $ }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .name }}
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: {{ .name }}
        spec:
          containers:
          - name: {{ .name }}
            {{- if .env }}
            env:
            {{- range .env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
            {{- else if $.Values.env }}
            env:
            {{- range $.Values.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
            {{- end }}
            image: {{ .image | default $.Values.image }}
            imagePullPolicy: Always
            {{- if .command }}
            command:
            {{- range .command }}
            - {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if .args }}
            args:
            {{- range .args }}
            - {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- $effectiveResources := .resources | default $.Values.resources }}
            {{- if $effectiveResources }}
            resources: {{ toYaml $effectiveResources | nindent 12 }}
            {{- end }}
            {{- $spcMounts := include "multi-scheduler.spcVolumeMounts" $ctx | trim }}
            {{- $extraVolumeMounts := .extraVolumeMounts | default $.Values.extraVolumeMounts }}
            {{- if or $spcMounts $extraVolumeMounts }}
            volumeMounts:
            {{- if $spcMounts }}{{ $spcMounts | nindent 12 }}{{- end }}
            {{- if $extraVolumeMounts }}{{ toYaml $extraVolumeMounts | nindent 12 }}{{- end }}
            {{- end }}
          dnsPolicy: ClusterFirst
          {{- $hostAliases := .hostAliases | default $.Values.hostAliases }}
          {{- if $hostAliases }}
          hostAliases:
          {{- toYaml $hostAliases | nindent 10 }}
          {{- end }}
          {{- if $.Values.imagePullSecrets }}
          imagePullSecrets:
          {{- range $.Values.imagePullSecrets }}
          - name: {{ .name }}
          {{- end }}
          {{- end }}
          restartPolicy: Never
          {{- $spcVols := include "multi-scheduler.spcVolumes" $ctx | trim }}
          {{- $extraVolumes := .extraVolumes | default $.Values.extraVolumes }}
          {{- if or $spcVols $extraVolumes }}
          volumes:
          {{- if $spcVols }}{{ $spcVols | nindent 10 }}{{- end }}
          {{- if $extraVolumes }}{{ toYaml $extraVolumes | nindent 10 }}{{- end }}
          {{- end }}
  schedule: {{ .schedule | quote }}
  successfulJobsHistoryLimit: 3
  suspend: {{ .suspend | default "false" }}
  timezone: {{ .timezone | default "Asia/Jakarta" }}
---
{{- end }}